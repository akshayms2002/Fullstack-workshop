<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <input type="text" name="txt">
    <button onclick="msg()">sign in</button>
    <h1 id="d1"></h1>
    <h2></h2>
    <script>
        function msg(){
            let data = document.getElementsByName("txt")[1]
            let display = document.getElementById("d1")
            display.innerHTML = data.value;
            display.style.color = "red"
            display.style.fontSize = "50px"
            }    
    </script>
</body>
</html>
